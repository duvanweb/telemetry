services:
  postgres:
    image: postgres:16
    container_name: telemetry-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: geo_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./docker/init-alert-db.sh:/docker-entrypoint-initdb.d/init-alert-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geo_service"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: telemetry-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: telemetry-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 5
